
# Continuous Integration workflow

name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux Go ${{ matrix.go }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go: ["~1.17", "^1.18"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: |
          export GO111MODULE=on
          go version
          make

      - name: Install test prerequisites
        run: sudo test/install-prereq.sh

      - name: Run integration tests
        run: make gh-it

      - name: Run unit tests
        run: make ut

      # Run static analysis last because installing the tool
      # may modify go.mod and affect earlier test steps.
      - name: Run static analysis
        if: ${{ matrix.go != '~1.17' }}
        run: |
          export GO111MODULE=on
          go install honnef.co/go/tools/cmd/staticcheck@latest
          make golint

  macos:
    name: macOS Go ${{ matrix.go }}
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        go: ["~1.16"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: |
          export GO111MODULE=on
          go version
          make

      - name: Install test prerequisites
        run: sudo test/install-prereq.sh

      - name: Run integration tests
        run: make gh-it

      - name: Run unit tests
        run: make ut
