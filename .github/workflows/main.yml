
# Continuous Integration workflow

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        go: ["~1.17", "^1.18"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Build
        run: |
          export GO111MODULE=on
          go version
          make

      - name: Install test prerequisites
        run: test/install-prereq.sh

      - name: Run integration tests
        run: make gh-it

      - name: Run unit tests
        run: make ut

      # Run static analysis last so build and test results are
      # available even if installing the analysis tool fails.
      - name: Run static analysis
        if: ${{ matrix.go != '~1.17' }}
        run: |
          export GO111MODULE=on
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          make golint

  macos:
    name: macOS Go ${{ matrix.go }}
    runs-on: macos-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        go: ["~1.16"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Build
        run: |
          export GO111MODULE=on
          go version
          make

      - name: Install test prerequisites
        run: test/install-prereq.sh

      - name: Run integration tests
        run: make gh-it

      - name: Run unit tests
        run: make ut
